name: MCP endpoint liveness

# Keep the examples honest: run the anonymous quickstart against the live
# endpoint weekly and on every push. If the anonymous tier breaks or the
# response shape drifts, this goes red before a visitor finds out.
# Anonymous-only — no secrets are used or needed here.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC — low cadence, it's a signal not a load test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run anonymous quickstart against production
        run: bash examples/quickstart.sh
      - name: Run walkthrough (anonymous leg, zero-dep Node)
        run: node examples/walkthrough.mjs
      - name: TOOLS.md drift check (anonymous tool names must match live tools/list)
        run: |
          LIVE=$(curl -sS --max-time 30 -X POST https://api.epinu.ai/api/agent/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | python3 -c 'import json,sys; [print(t["name"]) for t in json.load(sys.stdin)["result"]["tools"]]')
          echo "live anonymous tools:"; echo "$LIVE"
          FAIL=0
          for t in $LIVE; do grep -q "$t" TOOLS.md || { echo "::error::$t is live but missing from TOOLS.md"; FAIL=1; }; done
          for t in getting_started marketplace_listings_search projects_search; do
            echo "$LIVE" | grep -q "^$t$" || { echo "::error::$t documented in TOOLS.md but no longer live"; FAIL=1; }
          done
          exit $FAIL
