name: MCP endpoint liveness

# Keep the examples honest: run the anonymous quickstart against the live
# endpoint weekly and on every push. If the anonymous tier breaks or the
# response shape drifts, this goes red before a visitor finds out.
# Anonymous-only — no secrets are used or needed here.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC — low cadence, it's a signal not a load test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run anonymous quickstart against production
        run: bash examples/quickstart.sh
      - name: Run walkthrough (anonymous leg, zero-dep Node)
        run: node examples/walkthrough.mjs
