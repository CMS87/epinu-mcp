name: MCP endpoint liveness

# Keep the examples honest: run the anonymous quickstart against the live
# endpoint weekly and on every push. If the anonymous tier breaks or the
# response shape drifts, this goes red before a visitor finds out.
# Anonymous-only — no secrets are used or needed here.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC — low cadence, it's a signal not a load test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run anonymous quickstart against production
        run: bash examples/quickstart.sh
      - name: Run walkthrough (anonymous leg, zero-dep Node)
        run: node examples/walkthrough.mjs
      - name: TOOLS.md drift check (exact set — both directions)
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 30 -X POST https://api.epinu.ai/api/agent/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | python3 -c 'import json,sys; [print(t["name"]) for t in json.load(sys.stdin)["result"]["tools"]]' \
            | sort -u > /tmp/live-tools.txt
          python3 -c 'import re,pathlib; s=pathlib.Path("TOOLS.md").read_text().split("## Tools",1)[1]; [print(n) for n in re.findall(r"^### `([^`]+)`", s, re.M)]' \
            | sort -u > /tmp/documented-tools.txt
          echo "live:"; cat /tmp/live-tools.txt
          echo "documented:"; cat /tmp/documented-tools.txt
          diff -u /tmp/documented-tools.txt /tmp/live-tools.txt
